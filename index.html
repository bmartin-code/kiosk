<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosk Presentation Display</title>
    <style>
        /* Reset and Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
        }

        /* 1. The Presentation Layer */
        .presentation-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        /* 2. The Overlay Bar (4 Equal Quarters) */
        .info-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 10%;
            z-index: 10;
            background-color: rgba(166, 25, 46, 0.9);
            color: #e0e0e0;
            display: flex;
            align-items: center;
            padding: 0 2rem;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
        }

        /* Shared Quarter Column Styling */
        .bar-quarter {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
            font-family: "Segoe UI", sans-serif;
        }

        /* --- QUARTER 1: DATE --- */
        .date-display {
            align-items: flex-start;
            text-align: left;
        }
        .day-line {
            font-size: 3.5vh;
            font-weight: 800;
            line-height: 1.1;
        }
        .date-line {
            font-size: 2.3vh;
            font-weight: 400;
            opacity: 0.9;
        }

        /* --- QUARTER 2: WEATHER --- */
        .weather-display {
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }
        .weather-icon {
            font-size: 5.2vh;
            line-height: 1;
        }
        .weather-text {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }
        .weather-temp {
            font-size: 3.8vh;
            font-weight: 700;
            line-height: 1.05;
        }
        .weather-condition {
            font-size: 2vh;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.85;
            max-width: 240px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- QUARTER 3: BELL SCHEDULE --- */
        .schedule-display {
            align-items: center;
            text-align: center;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
        }
        .period-name {
            font-size: 3.5vh;
            font-weight: 700;
            line-height: 1.1;
        }
        .period-remaining {
            font-size: 2.2vh;
            font-weight: 400;
            opacity: 0.9;
        }

        /* --- QUARTER 4: TIME --- */
        .time-display {
            align-items: flex-end;
            text-align: right;
            font-size: 4.8vh;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            color: #e0e0e0;
        }

        /* Hidden QR Container (kept for JS music toggle compatibility) */
        .qr-container {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 1. The Google Slides Embed -->
    <iframe id="slide-frame"
            class="presentation-frame"
            src=""
            frameborder="0"
            allowfullscreen="true"
            mozallowfullscreen="true"
            webkitallowfullscreen="true">
    </iframe>

    <!-- 2. The Bottom Overlay Bar (4 Quarters) -->
    <div class="info-bar">
        <!-- QUARTER 1: Date -->
        <div class="bar-quarter date-display">
            <div id="day-line" class="day-line">Loading...</div>
            <div id="date-line" class="date-line">...</div>
        </div>

        <!-- QUARTER 2: Weather -->
        <div class="bar-quarter weather-display">
            <div class="weather-icon" id="weather-icon">🌤️</div>
            <div class="weather-text">
                <div class="weather-temp" id="weather-temp">--°F</div>
                <div class="weather-condition" id="weather-desc">Checking Weather...</div>
            </div>
        </div>

        <!-- QUARTER 3: Bell Schedule & Time Left -->
        <div class="bar-quarter schedule-display">
            <div class="period-name" id="period-name">Schedule</div>
            <div class="period-remaining" id="period-remaining">--</div>
        </div>

        <!-- QUARTER 4: Time -->
        <div class="bar-quarter time-display" id="time-container">
            --:--:--
        </div>

        <div class="qr-container" title="Click to Toggle Music"></div>
    </div>

    <script>
        // --- Configuration & URL Parsing ---
        function getQueryParam(param, defaultValue) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param) || defaultValue;
        }

        // 1. Get Settings from URL or use Defaults
        const slideId = getQueryParam('slides', '1_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx');
        const slideDelay = getQueryParam('timeslides', '8000');
        const refreshInterval = parseInt(getQueryParam('refresh', '1800000'), 10); // Default 30 mins
        const enableMusic = getQueryParam('music', 'true') === 'true';

        // 2. Initialize Slide Iframe
        const frameSrc = `https://docs.google.com/presentation/d/154CKUDIp-KExwWiAxbveV13eiXGKs0cFpTDR0-eDIGQ/embed?start=true&loop=true&rm=minimal&delayms=${slideDelay}`;
        const iframeEl = document.getElementById('slide-frame');
        iframeEl.src = frameSrc;

        // --- Deshler Bell Schedules (Edit times in 24-hour HH:MM format) ---
        const monThuSchedule = [
            { name: "1st Period", start: "07:50", end: "08:55" },
            { name: "2nd Period", start: "08:58", end: "10:03" },
            { name: "3rd Period", start: "10:06", end: "11:11" },
            {
                name: "4th Period",
                start: "11:14",
                end: "12:44",
                lunches: [
                    { name: "A Lunch", start: "11:17", end: "11:44" },
                    { name: "B Lunch", start: "11:46", end: "12:14" },
                    { name: "C Lunch", start: "12:16", end: "12:44" }
                ]
            },
            { name: "5th Period", start: "12:47", end: "13:52" },
            { name: "6th Period", start: "13:55", end: "15:00" }
        ];

        const fridaySchedule = [
            { name: "1st Period", start: "07:50", end: "08:55" },
            { name: "2nd Period", start: "08:58", end: "09:54" },
            { name: "3rd Period", start: "09:57", end: "10:53" },
            {
                name: "4th Period",
                start: "10:56",
                end: "12:25",
                lunches: [
                    { name: "A Lunch", start: "10:59", end: "11:25" },
                    { name: "B Lunch", start: "11:27", end: "11:55" },
                    { name: "C Lunch", start: "11:57", end: "12:25" }
                ]
            },
            { name: "REACH Period", start: "12:28", end: "13:02" },
            { name: "5th Period", start: "13:05", end: "14:01" },
            { name: "6th Period", start: "14:04", end: "15:00" }
        ];

        function getBellStatus(now) {
            const day = now.getDay(); // 0 = Sun, 5 = Fri, 6 = Sat
            if (day === 0 || day === 6) {
                return { title: "Weekend", sub: "No Classes" };
            }

            // Use Friday schedule on Fridays (day === 5), otherwise Mon-Thu schedule
            const activeSchedule = (day === 5) ? fridaySchedule : monThuSchedule;

            const currentMins = now.getHours() * 60 + now.getMinutes();
            const toMins = (t) => {
                const [h, m] = t.split(':').map(Number);
                return h * 60 + m;
            };

            const firstStart = toMins(activeSchedule[0].start);
            const lastEnd = toMins(activeSchedule[activeSchedule.length - 1].end);

            if (currentMins < firstStart) {
                const diff = firstStart - currentMins;
                return {
                    title: "Before School",
                    sub: diff <= 60 ? `1st Period in ${diff}m` : "Welcome"
                };
            }
            if (currentMins >= lastEnd) {
                return { title: "After School", sub: "Dismissed" };
            }

            for (let i = 0; i < activeSchedule.length; i++) {
                const period = activeSchedule[i];
                const start = toMins(period.start);
                const end = toMins(period.end);

                if (currentMins >= start && currentMins < end) {
                    const periodMinsLeft = end - currentMins;

                    // Check if this period has A/B/C lunch waves
                    if (period.lunches) {
                        for (const lunch of period.lunches) {
                            const lStart = toMins(lunch.start);
                            const lEnd = toMins(lunch.end);
                            if (currentMins >= lStart && currentMins < lEnd) {
                                const lunchMinsLeft = lEnd - currentMins;
                                return {
                                    title: period.name,
                                    sub: `${lunch.name} • ${lunchMinsLeft} min left`
                                };
                            }
                        }
                    }

                    return {
                        title: period.name,
                        sub: `${periodMinsLeft} min left`
                    };
                }

                if (i < activeSchedule.length - 1) {
                    const nextStart = toMins(activeSchedule[i + 1].start);
                    if (currentMins >= end && currentMins < nextStart) {
                        const minsLeft = nextStart - currentMins;
                        return {
                            title: "Class Change",
                            sub: `${minsLeft} min left`
                        };
                    }
                }
            }
            return { title: "", sub: "" };
        }

        // --- Clock & Schedule Logic ---
        function updateClock() {
            const now = new Date();
            const dayName = new Intl.DateTimeFormat('en-US', { weekday: 'long' }).format(now);
            const dateRest = new Intl.DateTimeFormat('en-US', { year: 'numeric', month: 'long', day: 'numeric' }).format(now);
            const timeString = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            const scheduleStatus = getBellStatus(now);

            document.getElementById('day-line').textContent = dayName;
            document.getElementById('date-line').textContent = dateRest;
            document.getElementById('period-name').textContent = scheduleStatus.title;
            document.getElementById('period-remaining').textContent = scheduleStatus.sub;
            document.getElementById('time-container').textContent = timeString;
        }

        // --- Weather Icon Helper ---
        function getWeatherIcon(desc) {
            const d = desc.toLowerCase();
            const hour = new Date().getHours();
            const isNight = hour < 6 || hour >= 19;

            if (d.includes('thunder') || d.includes('storm')) return '⛈️';
            if (d.includes('snow') || d.includes('sleet') || d.includes('ice') || d.includes('freezing')) return '❄️';
            if (d.includes('rain') || d.includes('shower') || d.includes('drizzle')) return '🌧️';
            if (d.includes('fog') || d.includes('mist') || d.includes('haze')) return '🌫️';
            if (d.includes('overcast') || d.includes('mostly cloudy')) return '☁️';
            if (d.includes('partly') || d.includes('few clouds') || d.includes('scattered')) {
                return isNight ? '☁️' : '⛅';
            }
            if (d.includes('clear') || d.includes('sunny') || d.includes('fair')) {
                return isNight ? '🌙' : '☀️';
            }
            return isNight ? '🌙' : '🌤️';
        }

        // --- Weather Function using NWS API ---
        async function updateWeather() {
            try {
                const response = await fetch(`https://api.weather.gov/stations/KMSL/observations/latest`, {
                    headers: {
                        'User-Agent': 'KioskDisplay/1.0 (techsupport@yourwebserver.org)',
                        'Accept': 'application/geo+json'
                    }
                });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                const props = data.properties;

                let tempText = "--°F";
                if (props.temperature && props.temperature.value !== null) {
                    const tempC = props.temperature.value;
                    const tempF = Math.round((tempC * 9/5) + 32);
                    tempText = `${tempF}°F`;
                }

                let descText = props.textDescription || "Local Weather";
                document.getElementById('weather-temp').textContent = tempText;
                document.getElementById('weather-desc').textContent = descText;
                document.getElementById('weather-icon').textContent = getWeatherIcon(descText);
            } catch (error) {
                console.error("Weather fetch failed:", error);
            }
        }

        // --- Audio Player Logic ---
        function initAudioPlayer() {
            const totalTracks = 137;
            let playlist = Array.from({length: totalTracks}, (_, i) => i + 1);
            let currentTrackIndex = 0;
            const audio = new Audio();

            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            function playTrack() {
                if (currentTrackIndex >= playlist.length) {
                    shuffle(playlist);
                    currentTrackIndex = 0;
                }
                const trackNumber = playlist[currentTrackIndex];
                const trackPath = `music/${trackNumber}.mp3`;
                audio.src = trackPath;
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => {
                        console.warn("Autoplay was prevented.", e);
                    });
                }
                currentTrackIndex++;
            }

            audio.addEventListener('ended', () => {
                setTimeout(() => {
                    playTrack();
                }, 1000);
            });

            const qrTrigger = document.querySelector('.qr-container');
            qrTrigger.addEventListener('click', () => {
                if (audio.paused) {
                    audio.play();
                } else {
                    audio.pause();
                }
            });

            shuffle(playlist);
            playTrack();
        }

        // --- Initialization ---
        updateClock();
        updateWeather();
        setInterval(updateClock, 1000);
        setInterval(updateWeather, 900000); // 15 mins

        if (enableMusic) {
            window.addEventListener('load', initAudioPlayer);
        }

        // --- Refresh Logic ---
        setInterval(() => {
            console.log("Refreshing Iframe...");
            iframeEl.src = iframeEl.src;
        }, refreshInterval);

        const twentyFourHours = 24 * 60 * 60 * 1000;
        setTimeout(() => {
            console.log("Performing Daily Hard Refresh...");
            window.location.reload(true);
        }, twentyFourHours);
        
        // --- Keep Chromebox Display Awake (Replaces Chrome Sign Builder Wake Lock) ---
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Screen Wake Lock active');
                }
            } catch (err) {
                console.warn('Wake Lock request failed:', err);
            }
        }
        requestWakeLock();
        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });
    </script>
</body>
</html>
